<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트레이딩 시그널 & 손익 대시보드</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e24;
            --section-bg: #25252e;
            --dashboard-bg: #1a1e24;
            --text-color: #e0e0e0;
            --accent-color: #00d26a;
            --danger-color: #f6465d;
            --border-color: #333;
            --highlight-color: #2b313c;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin: 0;
            color: #fff;
        }

        .section {
            background-color: var(--section-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .grid-ep { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
        .grid-tp { display: grid; grid-template-columns: 80px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            margin: 0;
            user-select: none;
            font-weight: bold;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
            margin: 0;
        }

        /* TP 달성 체크박스 특별 컬러 */
        .tp-checkbox input[type="checkbox"] { accent-color: #3b82f6; }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            background-color: #1a1a20;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* 현황판(대시보드) 스타일 */
        .dashboard {
            background-color: var(--dashboard-bg);
            border: 1px solid #3b82f6;
        }
        
        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .dash-item {
            background-color: rgba(255,255,255,0.03);
            padding: 15px 10px;
            border-radius: 8px;
        }

        .dash-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .dash-value {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .positive { color: var(--accent-color); }
        .negative { color: var(--danger-color); }

        .output-box {
            background-color: #1a1a20;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        textarea {
            width: 100%;
            height: 220px;
            background-color: transparent;
            border: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            line-height: 1.5;
        }

        textarea:focus { outline: none; }

        .copy-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .copy-btn:hover { background-color: #00e075; }
        .copy-btn:active { transform: scale(0.98); }

        /* 시그널 자동 입력 */
        .signal-input {
            height: 150px;
            padding: 10px;
            background-color: #1a1a20;
            border: 1px dashed #555;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
        }

        .signal-input:focus { border: 1px solid var(--accent-color); }

        .signal-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .signal-btn {
            flex: 1;
            padding: 11px;
            background-color: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .signal-btn:hover { background-color: #4b8ff7; }
        .signal-btn:active { transform: scale(0.98); }
        .signal-btn.secondary { flex: 0 0 90px; background-color: #3a3a46; color: #ddd; }

        .signal-status { font-size: 13px; line-height: 1.5; margin-top: 10px; }
        .signal-status:empty { display: none; }
        .signal-status.ok { color: var(--accent-color); }
        .signal-status.warn { color: #f0b90b; }
        .signal-status.error { color: var(--danger-color); }

    </style>
</head>
<body>

<div class="container">
    <h1>📝 트레이딩 셋업 & 관리 보드</h1>

    <!-- 시그널 자동 입력 -->
    <div class="section">
        <div class="section-title">⚡ 시그널 붙여넣기 (자동 입력)</div>
        <textarea id="signalInput" class="signal-input" placeholder="트레이더 시그널 텍스트를 붙여넣으면 종목 / 포지션 / EP / TP / SL이 자동으로 입력됩니다.&#10;&#10;예)&#10;트레이더 매매 관점 (ETH)&#10;Long&#10;EP&#10;2,560 - 2,515&#10;TP 1 2,615&#10;TP 2 2,660&#10;S/L&#10;2,500"></textarea>
        <div class="signal-actions">
            <button type="button" class="signal-btn" onclick="applySignalFromInput()">⚡ 자동 입력</button>
            <button type="button" class="signal-btn secondary" onclick="clearSignalInput()">지우기</button>
        </div>
        <div class="signal-status" id="signalStatus"></div>
    </div>

    <!-- 기본 정보 -->
    <div class="section">
        <div class="section-title">기본 정보</div>
        <div class="grid-3">
            <div>
                <label>코인/종목명</label>
                <input type="text" id="coin" value="BTC" placeholder="예: BTC">
            </div>
            <div>
                <label>포지션</label>
                <select id="pos">
                    <option value="long">Long (매수)</option>
                    <option value="short">Short (매도)</option>
                </select>
            </div>
            <div>
                <label>레버리지 (x)</label>
                <input type="number" id="lev" value="10" min="1">
            </div>
        </div>
    </div>

    <!-- 진입가 (EP) -->
    <div class="section">
        <div class="section-title">진입가 (EP) - 체결 확인 ☑️</div>
        <div class="grid-ep">
            <label class="checkbox-label"><input type="checkbox" id="ep1Check" checked> EP 1</label>
            <div><label>진입가</label><input type="number" id="ep1Price" value="57800" step="0.01"></div>
            <div><label>투자금액 (USDT)</label><input type="number" id="ep1Usdt" value="25000"></div>
        </div>
        <div class="grid-ep">
            <label class="checkbox-label"><input type="checkbox" id="ep2Check" checked> EP 2</label>
            <input type="number" id="ep2Price" value="56500" step="0.01" placeholder="진입가">
            <input type="number" id="ep2Usdt" value="25000" placeholder="금액">
        </div>
        <div class="grid-ep">
            <label class="checkbox-label"><input type="checkbox" id="ep3Check"> EP 3</label>
            <input type="number" id="ep3Price" step="0.01" placeholder="진입가">
            <input type="number" id="ep3Usdt" placeholder="금액">
        </div>
    </div>

    <!-- 익절가 (TP) -->
    <div class="section">
        <div class="section-title">익절 타겟 (TP) - 도달 시 체크 ☑️</div>
        <div class="grid-tp">
            <label class="checkbox-label tp-checkbox"><input type="checkbox" id="tp1Check"> 달성 1</label>
            <div><label>TP 1 가격</label><input type="number" id="tp1Price" value="60200" step="0.01"></div>
            <div><label>비중 (%)</label><input type="number" id="tp1Pct" value="25"></div>
        </div>
        <div class="grid-tp">
            <label class="checkbox-label tp-checkbox"><input type="checkbox" id="tp2Check"> 달성 2</label>
            <input type="number" id="tp2Price" value="62200" step="0.01">
            <input type="number" id="tp2Pct" value="25">
        </div>
        <div class="grid-tp">
            <label class="checkbox-label tp-checkbox"><input type="checkbox" id="tp3Check"> 달성 3</label>
            <input type="number" id="tp3Price" value="65000" step="0.01">
            <input type="number" id="tp3Pct" value="25">
        </div>
        <div class="grid-tp">
            <label class="checkbox-label tp-checkbox"><input type="checkbox" id="tp4Check"> 달성 4</label>
            <input type="number" id="tp4Price" value="70000" step="0.01">
            <input type="number" id="tp4Pct" value="25">
        </div>
    </div>

    <!-- 손절가 (SL) -->
    <div class="section">
        <div class="section-title">손절 (SL)</div>
        <div class="grid-tp">
            <label class="checkbox-label" style="color:var(--danger-color);"><input type="checkbox" id="slCheck"> 도달</label>
            <div><label>SL 가격</label><input type="number" id="slPrice" value="55700" step="0.01"></div>
            <div><label>비중 (%)</label><input type="number" id="slPct" value="100"></div>
        </div>
    </div>

    <!-- 💰 실시간 대시보드 (손익 탭) -->
    <div class="section dashboard">
        <div class="section-title" style="color:#3b82f6;">💰 실시간 손익 현황 (체결 & 달성 기준)</div>
        <div class="dash-grid">
            <div class="dash-item">
                <div class="dash-label">체결된 평균 단가</div>
                <div class="dash-value" id="dashAvgEp">0.00</div>
            </div>
            <div class="dash-item">
                <div class="dash-label">총 진입 마진 (USDT)</div>
                <div class="dash-value" id="dashTotalMargin">0.00</div>
            </div>
            <div class="dash-item">
                <div class="dash-label">누적 확정 손익 (USDT)</div>
                <div class="dash-value" id="dashProfit">0.00</div>
            </div>
        </div>
    </div>

    <!-- 결과 복사 영역 -->
    <div class="output-box">
        <div class="section-title">공유용 텍스트 (손익금 제외)</div>
        <textarea id="outputText" readonly></textarea>
        <button class="copy-btn" onclick="copyText()">📋 텍스트 복사하기</button>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('input, select');
    inputs.forEach(input => {
        input.addEventListener('input', updateAll);
        input.addEventListener('change', updateAll);
    });

    function formatNum(num) {
        return Number(num).toLocaleString('en-US', {maximumFractionDigits: 4});
    }
    
    function formatMoney(num) {
        return Number(num).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function updateAll() {
        const coin = (document.getElementById('coin').value || 'BTC').toUpperCase();
        const posValue = document.getElementById('pos').value;
        const posText = posValue === 'long' ? 'Long' : 'Short';
        const lev = parseFloat(document.getElementById('lev').value) || 1;

        let text = `${coin} ${posText} ${lev}x\n\n`;

        // 1. EP(진입가) 처리 - 체크된 항목 선별
        let epList = [];
        let totalUsdt = 0;
        let totalCoins = 0;

        for(let i=1; i<=3; i++) {
            const isChecked = document.getElementById(`ep${i}Check`).checked;
            const p = parseFloat(document.getElementById(`ep${i}Price`).value);
            const u = parseFloat(document.getElementById(`ep${i}Usdt`).value) || 0;
            
            if (isChecked && p > 0) {
                epList.push({price: p, usdt: u});
            }
        }

        let avgEp = 0;
        let epString = '';
        let allHaveUsdt = true;

        if (epList.length > 0) {
            epString += `EP\n`;
            epList.forEach(ep => {
                epString += `${formatNum(ep.price)}`;
                if (ep.usdt > 0) {
                    epString += ` - ${formatNum(ep.usdt)} USDT\n`;
                    totalUsdt += ep.usdt;
                    totalCoins += (ep.usdt / ep.price);
                } else {
                    epString += '\n';
                    allHaveUsdt = false;
                }
            });

            if (allHaveUsdt && totalCoins > 0) {
                avgEp = totalUsdt / totalCoins; 
            } else {
                avgEp = epList.reduce((sum, ep) => sum + ep.price, 0) / epList.length; 
            }
            text += epString + '\n';
        } else {
            text += `EP\n진입 대기 중...\n\n`;
        }

        const canCalculateProfit = (allHaveUsdt && totalUsdt > 0 && epList.length > 0);
        let cumulativeRealizedProfit = 0; // 누적 손익(USDT)

        // 2. TP(익절) 처리 (텍스트에는 USDT 제외 / 대시보드에는 수익 합산)
        let tpString = '';
        let hasTp = false;

        for(let i=1; i<=4; i++) {
            const isAchieved = document.getElementById(`tp${i}Check`).checked;
            const p = parseFloat(document.getElementById(`tp${i}Price`).value);
            const pct = parseFloat(document.getElementById(`tp${i}Pct`).value);

            if (p > 0) {
                if (!hasTp) { tpString += `TP\n`; hasTp = true; }
                
                let roeStr = '';
                if (avgEp > 0) {
                    let rawRoe = (posValue === 'long' ? (p - avgEp)/avgEp : (avgEp - p)/avgEp) * lev * 100;
                    let weightedRoe = rawRoe * (pct / 100);
                    let sign = weightedRoe > 0 ? '+' : '';
                    
                    // 텍스트용: 원본 템플릿 유지 (수익금 표시 안함)
                    roeStr = ` (${sign}${weightedRoe.toFixed(2)}%)`;

                    // 대시보드용: 체크박스 달성 시 누적 확정 수익 합산
                    if (isAchieved && canCalculateProfit) {
                        cumulativeRealizedProfit += totalUsdt * (weightedRoe / 100);
                    }
                }

                let pctStr = pct > 0 ? ` - ${pct}%` : '';
                tpString += `${formatNum(p)}${pctStr}${roeStr}\n`;
            }
        }
        if (hasTp) text += tpString + '\n';

        // 3. SL(손절) 처리 
        const slAchieved = document.getElementById('slCheck').checked;
        const slPrice = parseFloat(document.getElementById('slPrice').value);
        const slPct = parseFloat(document.getElementById('slPct').value) || 100;
        
        if (slPrice > 0) {
            let roeStr = '';
            if (avgEp > 0) {
                let rawRoe = (posValue === 'long' ? (slPrice - avgEp)/avgEp : (avgEp - slPrice)/avgEp) * lev * 100;
                let weightedRoe = rawRoe * (slPct / 100);
                let sign = weightedRoe > 0 ? '+' : '';
                
                roeStr = ` (${sign}${weightedRoe.toFixed(2)}%)`;

                // 손절 도달 시 손실금 합산
                if (slAchieved && canCalculateProfit) {
                    cumulativeRealizedProfit += totalUsdt * (weightedRoe / 100);
                }
            }
            text += `SL\n${formatNum(slPrice)} - ${slPct}%${roeStr}\n`;
        }

        // 4. UI 업데이트
        document.getElementById('outputText').value = text.trim();
        
        // 대시보드 업데이트
        document.getElementById('dashAvgEp').innerText = avgEp > 0 ? formatNum(avgEp) : '0.00';
        document.getElementById('dashTotalMargin').innerText = totalUsdt > 0 ? formatMoney(totalUsdt) : '0.00';
        
        const dashProfit = document.getElementById('dashProfit');
        if (cumulativeRealizedProfit > 0) {
            dashProfit.innerText = `+${formatMoney(cumulativeRealizedProfit)}`;
            dashProfit.className = 'dash-value positive';
        } else if (cumulativeRealizedProfit < 0) {
            dashProfit.innerText = formatMoney(cumulativeRealizedProfit);
            dashProfit.className = 'dash-value negative';
        } else {
            dashProfit.innerText = '0.00';
            dashProfit.className = 'dash-value';
        }
    }

    function copyText() {
        const textarea = document.getElementById('outputText');
        textarea.select();
        textarea.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(textarea.value).then(() => {
            const btn = document.querySelector('.copy-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '✅ 복사 완료!';
            btn.style.backgroundColor = '#fff';
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.backgroundColor = 'var(--accent-color)';
            }, 1500);
        });
    }

    // ===== 시그널 텍스트 → 자동 입력 =====
    const SECTION_HEADERS = [
        { key: 'ep', re: /^(?:\d\s*차\s*)?(?:(?:long|short|롱|숏)\s*)?(?:e(?:\s*\/\s*|\.)?p\.?|entry(?:\s*(?:price|zone|targets?))?|entries|진입\s*(?:가격대|가격|가|구간|존|범위|영역|시점|타점)?|매수\s*(?:가격|가|구간)|타점)(?![a-z])/i },
        { key: 'tp', re: /^(?:\d\s*차\s*)?(?:t(?:\s*\/\s*|\.)?p\.?s?|take[\s\-]*profits?(?:\s*targets?)?|targets?|익절\s*(?:가격|가|구간|목표|라인|타점|지점)?|목표\s*(?:가격|가|구간|지점|라인|치)?)(?![a-z])/i },
        { key: 'sl', re: /^(?:s(?:\s*\/\s*|\.)?l\.?(?:\s*라인)?|stop[\s\-]*loss|stop(?:\s*targets?)?|손절\s*(?:가격|가|라인|선|기준|구간|지점)?|스탑\s*로스|스탑|로스\s*컷|무효화)(?![a-z])/i },
    ];
    // 한 줄에 여러 섹션이 있을 때 나누는 기준: "진입 2560 / 목표 2615 / 손절 2500"
    const INLINE_SECTION = '(?:\\d\\s*차\\s*)?(?:e(?:\\s*\\/\\s*|\\.)?p|entry|진입|t(?:\\s*\\/\\s*|\\.)?p\\.?s?|take[\\s\\-]*profit|targets?|목표|익절|s(?:\\s*\\/\\s*|\\.)?l|stop|손절)(?![a-z])[^\\d\\n|\\/,·→]*\\d(?![\\d.,]*\\s*%)';
    const INLINE_SPLIT_POS = new RegExp(`^([^\\d\\n]*?(?:long|short|롱|숏)(?![a-z]))\\s*[\\/|,·]?\\s+(?=${INLINE_SECTION})`, 'i');
    const INLINE_SPLIT_ANY = new RegExp(`\\s*[|·]\\s*(?=${INLINE_SECTION})`, 'gi');
    const INLINE_SPLIT_AFTER_NUM = new RegExp(`(\\d%?)(?:\\s*[\\/,]\\s*|\\s+)(?=${INLINE_SECTION})`, 'gi');
    // 다른 동작을 설명하는 메모: "TP1 체결 시 본절로 변경", "진입 후 미체결 시 취소"
    const NOTE_ACTION = /체결|도달|터치|이동|변경|상향|하향|본절|취소|무효/;
    const NOTE_CANCEL = /취소|무효|미체결/;
    // 가격처럼 보이는 숫자 (세 자리 이상, 콤마, 소수점)
    const PRICE_LIKE = /(?:^|[^\p{L}\d.,])(?:\d{1,3}(?:,\d{3})+|\d{3,}|\d+\.\d+)/u;
    // 숫자에 바로 붙어도 가격으로 보는 단어: "2,500선", "2,560부근", "2,560이나"
    const PRICE_SUFFIX = /^(?:원|달러|불|부근|근처|정도|쯤|선|대|라인|이하|이상|까지|부터|에서|이나|혹은|또는|및|와|과)/;
    const DATE_WORD = /업데이트|update|날짜|일자|기준일/i;
    // 포지션으로 오인하기 쉬운 표현
    const POS_NOISE = /숏\s*스퀴즈|숏\s*커버(?:링)?|[롱숏]\s*청산|롱\s*\/?\s*숏|과매[수도]|매[수도]\s*세|(?:long|short)[\s\-]*term/gi;
    const NON_COIN = new Set(['LONG', 'SHORT', 'EP', 'TP', 'SL', 'USDT', 'USDC', 'BUSD', 'USD', 'KRW', 'PERP',
        'ENTRY', 'TARGET', 'TARGETS', 'STOP', 'LOSS', 'BUY', 'SELL', 'ROE', 'PNL', 'SPOT', 'DCA', 'BE',
        'VIP', 'SIGNAL', 'SIGNALS', 'FREE', 'NEW', 'TRADE', 'SCALP', 'SWING', 'UPDATE', 'ALERT', 'TYPE', 'REGULAR',
        'BINANCE', 'BYBIT', 'OKX', 'BITGET', 'UPBIT', 'BITHUMB', 'CROSS', 'ISOLATED', 'MARKET', 'LIMIT', 'CMP',
        'FVG', 'OB', 'ATL', 'HTF', 'LTF', 'RSI', 'EMA', 'MA', 'MACD', 'NFA', 'DYOR', 'MAX', 'MIN']);

    // 메모/수익률/비율/날짜 제거: "2,615(체결 시 본절)" → "2,615", "(+41.52%)", "(1:2)", "2026.10.07" → ""
    function stripNotes(raw) {
        return raw
            .replace(/\d️?⃣/g, ' ')                                                  // 1️⃣ 키캡 번호
            .replace(/\d+(?:\.\d+)?\s*%\s*(?=손실|손해|리스크|loss|risk)/gi, ' ')                  // "2.3% 손실"
            .replace(/[(\[（]([^()\[\]（）]*)[)\]）]/g, (m, inner) => {
                if (/^[\d\s,.\/~\-–|]+$/.test(inner) && /\d{3}|\d\.\d/.test(inner)) return ` ${inner} `;   // (2,660), [2615, 2660]
                const w = inner.match(/^\s*(?:비중\s*[:：]?\s*)?(\d{1,3}(?:\.\d+)?)\s*%\s*(?:익절|청산|비중)?\s*$/);
                return w && /익절|청산|비중/.test(inner) ? ` ${w[1]}% ` : ' ';                // (50% 익절)
            })
            .replace(/(^|[^\d.,])(?:19|20)\d{2}([.\-\/])\d{1,2}\2\d{1,2}(?![\d.,])/g, '$1 ')      // 2026.10.07
            .replace(/(^|\s)(\d{1,2})\/(\d{1,2})(?=\s|$)/g, (m, p, a, b) =>                   // 10/07 업데이트
                /^0/.test(a) || /^0/.test(b) || DATE_WORD.test(raw) ? p + ' ' : m)
            .replace(/(?:r\s*[:\/]\s*r|rr|손익비|비율)\s*[:：]?\s*\d+(?:\.\d+)?\s*[:\/]\s*\d+(?:\.\d+)?/gi, ' ')   // R:R 1:2
            .replace(/(^|[^\p{L}\d.,])\d{1,2}:\d{2}(?![\d.,])/gu, '$1 ');                      // 14:00
    }

    function trimLead(line) {
        return line.replace(/^[^\p{L}\p{N}]+/u, '').trim();
    }

    function splitInlineSections(line) {
        return line
            .replace(INLINE_SPLIT_POS, '$1\n')
            .replace(INLINE_SPLIT_ANY, '\n')
            .replace(INLINE_SPLIT_AFTER_NUM, '$1\n')
            .split('\n');
    }

    // "TP 1 2,615", "진입 2차: 2,515" → 순번 제거 ("EP 4 - 3.85"의 4는 가격이라 유지)
    function stripIndex(rest, count, isHeader) {
        const m = rest.match(/^\s*[#\-]?\s*(\d)(?![\d.,])\s*(차|번)?/);
        if (!m) return rest;
        const d = Number(m[1]);
        const next = rest.slice(m[0].length).match(/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/);
        const nextVal = next ? parseFloat(next[0].replace(/,/g, '')) : 0;
        return m[2] || nextVal >= d * 10 || (isHeader && d <= count + 1) ? rest.slice(m[0].length) : rest;
    }

    // 머리글 뒤가 한글 메모로 시작하면 메모 줄: "스탑로스는 TP1 체결 시 본절로 변경"
    function isNoteRest(rest) {
        if (!/^[\s:：\-]*\p{Script=Hangul}/u.test(rest) || /^[\s:：\-]*[은는이가을를]?\s*[:：]?\s*[\d$]/u.test(rest)) return false;
        if (NOTE_ACTION.test(rest)) return true;
        return !PRICE_LIKE.test(rest) && (rest.match(/\p{Script=Hangul}+/gu) || []).length >= 2;
    }

    // 한 줄에서 가격 / 비중(%) / 금액(USDT) 추출
    function extractSignalValues(line, section) {
        const entries = [];
        for (const m of line.matchAll(/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/g)) {
            const before = line[m.index - 1] || '';
            const after = line.slice(m.index + m[0].length);
            const prefix = line.slice(0, m.index);
            if (/[\p{L}.]/u.test(before)) continue;           // H4, EMA200 등
            if (/\d\s*[x×*]\s*$/i.test(prefix)) continue;      // "2,560 x 2 분할"의 배수
            const unit = (after.match(/^\s*(%|usdt|usdc|busd|usd)(?![a-z])/i) || [])[1];
            if (!unit && /^\p{L}/u.test(after) && !PRICE_SUFFIX.test(after)) continue;   // 4시간, 1차, 10x, 2,560으로 등
            const value = parseFloat(m[0].replace(/,/g, ''));
            if (!(value > 0)) continue;

            const last = entries[entries.length - 1];
            if (unit === '%') {
                // "+2.1%", "-2.34%", "ROE 21%"는 비중이 아니라 수익률
                if (/(?:[+−]|(?:^|\s)-)$/.test(prefix) || /(?:roe|pnl)[^\d]*$/i.test(prefix)) continue;
                if (last && last.pct == null) last.pct = value;
            } else if (unit && section === 'ep' && last && last.usdt == null && (!last.priceUnit || value < last.price / 2)) {
                last.usdt = value;    // "57,800 - 30,000 USDT"
            } else {
                entries.push(unit ? { price: value, priceUnit: true } : { price: value });
            }
        }
        return entries;
    }

    function normalizeCoin(sym) {
        const s = sym.toUpperCase().replace(/[\s\/\-_]/g, '').replace(/(?:USDT|USDC|BUSD|USD|KRW|PERP)+$/, '');
        return s.length >= 2 && !NON_COIN.has(s) && !/^[HMDW]\d{1,3}$/.test(s) ? s : '';
    }

    function detectCoin(rawHeader, text, headerLines) {
        const candidates = [];
        // 1) 머리글 괄호 안 티커: (ETH), [BTCUSDT]
        for (const m of rawHeader.matchAll(/[(\[]\s*([A-Z][A-Z0-9]{1,14}(?:\s*\/\s*[A-Z]{3,4})?)\s*[)\]]/g)) candidates.push(m[1]);
        // 2) $ETH, #ETH, ETH/USDT, ETHUSDT
        for (const m of text.matchAll(/[#$]([A-Za-z][A-Za-z0-9]{1,14})/g)) candidates.push(m[1]);
        for (const m of text.matchAll(/\b([A-Z][A-Z0-9]{1,14})\s*[\/\-]?\s*(?:USDT|USDC|BUSD|USD|KRW)\b/g)) candidates.push(m[1]);
        // 3) 머리글의 대문자 단어, 포지션이 적힌 줄 우선: "BTC Long 10x"
        const posLines = headerLines.filter(line => /\b(?:long|short)\b|롱|숏/i.test(line));
        [...posLines, ...headerLines].forEach(line => {
            for (const m of line.matchAll(/\b([A-Z][A-Z0-9]{1,9})\b/g)) candidates.push(m[1]);
        });
        for (const c of candidates) {
            const coin = normalizeCoin(c);
            if (coin) return coin;
        }
        return '';
    }

    function detectPosition(lines, rawLines) {
        const cleaned = lines.map(line => line.replace(POS_NOISE, ' '));
        const toPos = word => /^(long|롱|매수)$/i.test(word) ? 'long' : 'short';
        // 1) 줄 맨 앞의 포지션: "Long(메인)", "ETH 롱", "BTC Short 20x"
        for (const line of cleaned) {
            const m = line.match(/^(?:[A-Za-z0-9#$\/\-.]+\s+)?(long|short|롱|숏)(?![a-z])/i);
            if (m) return toPos(m[1]);
        }
        // 2) 아무 곳의 long/short/롱/숏, 3) 괄호 안 "(SHORT)", 4) 매수/매도
        for (const line of cleaned) {
            const m = line.match(/\b(long|short)\b|(롱|숏)/i);
            if (m) return toPos(m[1] || m[2]);
        }
        for (const raw of rawLines) {
            const m = raw.match(/[(\[（]\s*(long|short|롱|숏)\s*[)\]）]/i);
            if (m) return toPos(m[1]);
        }
        for (const line of cleaned) {
            const m = line.match(/매수|매도/);
            if (m) return toPos(m[0]);
        }
        return '';
    }

    function detectLeverage(text) {
        const t = text
            // 한글 메모 괄호 제거, 단 "(20배)", "(레버리지 20배)"처럼 레버리지를 적은 괄호는 유지
            .replace(/[(\[（]([^()\[\]（）]*\p{Script=Hangul}[^()\[\]（）]*)[)\]）]/gu, (m, inner) =>
                /(?:^|[^\d.,])[x×]?\d{1,3}\s*(?:배|x|×)|레버/i.test(inner) && !/물량|수량|비중|분할|손익비|수익|거래량/.test(inner) ? ` ${inner} ` : ' ')
            .replace(/(?:손익비|물량|수량|거래량|수익|비중)\s*\d{1,3}\s*배/g, ' ');
        const m = t.match(/(?:레버리지|레버|leverage)\s*[:：]?\s*(?:cross|isolated|교차|격리)?\s*[:：(]?\s*[x×]?\s*(\d{1,3})(?![\d.,])/i)
            || t.match(/(?:^|[^\w.,])(\d{1,3})\s*(?:x|×|배)(?![a-z])(?!\s*(?:물량|수량|비중|분할))/im)
            || t.match(/(?:^|[^a-z])[x×]\s*(\d{1,3})(?![\d.,a-z])(?!\s*(?:물량|수량|비중|분할))/im)
            || (s => s && Number(s[1]) >= 5 ? s : null)(t.match(/(?:^|[^\w.,])(\d{1,3})\s*(?:x|×|배)\s*분할/i));   // "20배 분할 진입" ("2배 분할"은 분할 횟수)
        const lev = m ? parseInt(m[1], 10) : 0;
        return lev >= 1 && lev <= 250 ? lev : 0;
    }

    function parseSignal(text) {
        const result = { coin: '', pos: '', posInferred: false, posConflict: '', lev: 0, ep: [], tp: [], sl: [], truncated: false };
        const headerLines = [], rawHeaderLines = [], seenLines = [], seenRaw = [];
        let section = null;      // 현재 값을 받는 섹션
        let lastSection = null;  // 마지막으로 등장한 섹션 머리글
        let closed = null;       // 빈 줄로 닫힌 섹션

        // 두 줄에 걸친 괄호 메모 제거: "2,615(체결 시\n본절로 변경)"
        const src = text.replace(/\r/g, '').replace(/[(\[（][^()\[\]（）\n]*\n[^()\[\]（）\n]*[)\]）]/g, ' ');
        const pieces = [];
        src.split('\n').forEach(raw => {
            splitInlineSections(stripNotes(raw)).forEach(part => pieces.push({ raw, line: trimLead(part) }));
        });

        for (const piece of pieces) {
            let line = piece.line;
            const hasValues = result.ep.length || result.tp.length || result.sl.length;

            // 빈 줄/구분선은 값이 들어간 섹션을 닫음
            if (!line) {
                if (section && result[section].length) { closed = section; section = null; }
                continue;
            }
            // 두 번째 시나리오(예: "Short(서브)")가 시작되면 첫 번째 시나리오만 사용
            if (hasValues && /^(?:long|short|롱|숏)(?![a-z])/i.test(line)) {
                result.truncated = true;
                break;
            }
            seenLines.push(line);
            seenRaw.push(piece.raw);

            const header = SECTION_HEADERS.find(h => h.re.test(line));
            if (header) {
                let rest = line.replace(header.re, '');
                if (header.key !== 'sl') rest = stripIndex(rest, result[header.key].length, true);
                if (isNoteRest(rest)) {           // "스탑로스는 TP1 체결 시 본절로 변경" 같은 메모 줄
                    if (!hasValues) rawHeaderLines.push(piece.raw);
                    continue;
                }
                if (header.key !== lastSection && result[header.key].length) {
                    result.truncated = true;
                    break;
                }
                section = lastSection = header.key;
                closed = null;
                line = rest.replace(/^[\s:：\-]*[은는이가을를](?=\s*[:：]?\s*[\d$])/, '');
            } else if (section) {
                if (section !== 'sl' && NOTE_CANCEL.test(line)) continue;   // "2,480 이탈 시 진입 취소"
                if (section !== 'sl') line = stripIndex(line, result[section].length, false);
            } else if (closed && closed === lastSection && /^[\d,.\s\-~–]+$/.test(line)
                && (v => v > result[closed].slice(-1)[0].price / 2 && v < result[closed].slice(-1)[0].price * 2)(parseFloat(line.replace(/,/g, '')))) {
                section = closed;   // "EP\n2,560\n\n2,515"처럼 빈 줄로 띄운 값
            } else {
                if (!lastSection) {
                    headerLines.push(line);
                    rawHeaderLines.push(piece.raw);
                }
                continue;
            }

            const action = line.search(NOTE_ACTION);
            if (action >= 0) line = line.slice(0, action);   // "2,615 체결 시 SL 2,560 본절로 변경" → "2,615"
            line = line
                .replace(/^\s*#?\d{1,2}(?:[.)]\s+|:\s*)(?=\d)/, '')   // "1. 2,615", "1: 2,615" 목록 번호
                .replace(/(^|\s)\d{1,2}\)\s+(?=\d)/g, '$1')            // "1) 2615 2) 2660"
                .replace(/\b(?:ep|tp)\s*#?\d(?![\d.,])/gi, ' ');      // 같은 줄의 "TP 2" 등
            const values = extractSignalValues(line, section);
            if (header && !values.length && !hasValues) rawHeaderLines.push(piece.raw);   // "롱 타점 (ETH)"
            result[section].push(...values);
        }

        // TP/SL에 "USDT"가 가격 단위로 쓰였으면 EP의 "A - B USDT"도 가격 범위로 봄
        if (result.tp.concat(result.sl).some(e => e.priceUnit)) {
            result.ep = result.ep.flatMap(e => e.usdt ? [{ price: e.price }, { price: e.usdt }] : [e]);
        }

        result.coin = detectCoin(rawHeaderLines.join('\n'), text, headerLines);
        result.pos = detectPosition(seenLines, seenRaw);
        result.lev = detectLeverage(text);

        // 가격 방향(TP/SL이 EP 위인지 아래인지)이 분명하면 그쪽을 우선
        if (result.ep.length) {
            const ep = result.ep[0].price;
            const byTp = result.tp.length ? (result.tp[0].price > ep ? 'long' : 'short') : '';
            const bySl = result.sl.length ? (result.sl[0].price < ep ? 'long' : 'short') : '';
            const byPrice = byTp && bySl && byTp !== bySl ? '' : (byTp || bySl);
            if (byPrice && byPrice !== result.pos) {
                result.posConflict = result.pos;
                result.pos = byPrice;
                result.posInferred = true;
            }
        }
        return result;
    }

    // 비중이 없는 TP는 남은 비중(100% - 지정된 비중)을 균등 분배
    function fillTpWeights(tps) {
        const missing = tps.filter(tp => tp.pct == null);
        if (!missing.length) return tps.map(tp => tp.pct);
        const given = tps.reduce((sum, tp) => sum + (tp.pct || 0), 0);
        const remain = Math.max(0, 100 - given);
        const base = Math.floor(remain / missing.length);
        let extra = remain - base * missing.length;
        return tps.map(tp => {
            if (tp.pct != null) return tp.pct;
            const pct = base + (extra > 0 ? 1 : 0);
            if (extra > 0) extra--;
            return pct;
        });
    }

    function applySignalFromInput() {
        const status = document.getElementById('signalStatus');
        const text = document.getElementById('signalInput').value;
        if (!text.trim()) {
            status.className = 'signal-status error';
            status.innerText = '⚠️ 시그널 텍스트를 붙여넣어 주세요.';
            return;
        }

        const sig = parseSignal(text);
        if (!sig.ep.length && !sig.tp.length && !sig.sl.length) {
            status.className = 'signal-status error';
            status.innerText = '⚠️ EP / TP / SL 값을 찾지 못했어요. 텍스트 형식을 확인해 주세요.';
            return;
        }

        const set = (id, value) => { document.getElementById(id).value = value; };
        const check = (id, checked) => { document.getElementById(id).checked = checked; };

        if (sig.coin) set('coin', sig.coin);
        if (sig.pos) set('pos', sig.pos);
        if (sig.lev) set('lev', sig.lev);

        // EP: 가격 입력 + 체결 체크 (투자금액은 시그널에 있을 때만 덮어씀)
        for (let i = 1; i <= 3; i++) {
            const ep = sig.ep[i - 1];
            set(`ep${i}Price`, ep ? ep.price : '');
            check(`ep${i}Check`, !!ep);
            if (ep && ep.usdt) set(`ep${i}Usdt`, ep.usdt);
        }

        // TP: 가격 + 비중, 달성 체크 해제
        const tps = sig.tp.slice(0, 4);
        const weights = fillTpWeights(tps);
        for (let i = 1; i <= 4; i++) {
            set(`tp${i}Price`, tps[i - 1] ? tps[i - 1].price : '');
            set(`tp${i}Pct`, tps[i - 1] ? weights[i - 1] : '');
            check(`tp${i}Check`, false);
        }

        // SL: 첫 번째 값 사용
        const sl = sig.sl[0];
        set('slPrice', sl ? sl.price : '');
        set('slPct', sl && sl.pct ? sl.pct : 100);
        check('slCheck', false);

        updateAll();

        const coin = (document.getElementById('coin').value || '').toUpperCase();
        const posText = document.getElementById('pos').value === 'long' ? 'Long' : 'Short';
        let msg = `✅ ${coin} ${posText}${sig.posInferred && !sig.posConflict ? '(가격으로 추정)' : ''} · EP ${Math.min(sig.ep.length, 3)}개 · TP ${tps.length}개 · SL ${sl ? formatNum(sl.price) : '없음'} 입력 완료`;
        const warnings = [];
        if (sig.posConflict) {
            const written = sig.posConflict === 'long' ? 'Long' : 'Short';
            warnings.push(`텍스트에는 ${written}로 보이지만 TP/SL 가격 기준으로 ${posText}로 입력했어요.`);
        }
        if (!sig.coin) warnings.push('종목명을 찾지 못해 기존 값을 유지했어요.');
        for (let i = 1; i <= Math.min(sig.ep.length, 3); i++) {
            if (!(parseFloat(document.getElementById(`ep${i}Usdt`).value) > 0)) {
                warnings.push(`EP ${i} 투자금액(USDT)이 비어 있어 손익이 계산되지 않아요.`);
            }
        }
        if (sig.ep.length > 3) warnings.push(`EP가 ${sig.ep.length}개라 앞의 3개만 입력했어요.`);
        if (sig.tp.length > 4) warnings.push(`TP가 ${sig.tp.length}개라 앞의 4개만 입력했어요.`);
        if (sig.truncated) warnings.push('시나리오가 여러 개라 첫 번째 시나리오만 입력했어요.');
        if (warnings.length) msg += '\n⚠️ ' + warnings.join('\n⚠️ ');

        status.className = `signal-status ${warnings.length ? 'warn' : 'ok'}`;
        status.innerText = msg;
    }

    function clearSignalInput() {
        document.getElementById('signalInput').value = '';
        document.getElementById('signalStatus').innerText = '';
        document.getElementById('signalInput').focus();
    }

    // 붙여넣기 하면 바로 자동 입력
    document.getElementById('signalInput').addEventListener('paste', e => {
        const box = e.target;
        const pasted = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
        const sig = parseSignal(pasted);
        const hasSignal = s => s.ep.length || s.tp.length || s.sl.length;
        if (e.clipboardData && !hasSignal(sig)) return;   // 시그널이 아니면 일반 붙여넣기
        // 이미 시그널이 있는 칸에 새 시그널 전체를 붙여넣으면 이어 붙이지 않고 교체 (Ctrl+Z로 되돌리기 가능)
        const isFullSignal = sig.ep.length && (sig.tp.length || sig.sl.length);
        if (e.clipboardData && isFullSignal && hasSignal(parseSignal(box.value))) {
            e.preventDefault();
            box.select();
            if (!document.execCommand || !document.execCommand('insertText', false, pasted)) box.value = pasted;
            applySignalFromInput();
            return;
        }
        setTimeout(applySignalFromInput, 0);   // 머리글 뒤에 본문을 붙이는 경우 등은 그대로 이어 붙임
    });

    // 초기 렌더링
    updateAll();
</script>
